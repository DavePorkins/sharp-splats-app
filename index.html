<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./SharpSplats.ico" sizes="any" />

    <title>Sharp Splats</title>
    <script type="module" crossorigin src="./assets/main-DcFyTZvj.js"></script>

  <body>
    <div id="app"></div>
    <template id="photo-generator-template">
      <section class="settings-section photo-generator" aria-label="Foto-Generator">
