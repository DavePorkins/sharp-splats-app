<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111715" />
    <link rel="icon" href="./SharpSplats.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./SharpSplats.ico" />
    <title>Sharp Splats</title>
    <script type="module" crossorigin src="./assets/main-D0DOAyOl.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/OrbitControls-CHWQx2l_.js">
    <link rel="stylesheet" crossorigin href="./assets/main-CsBx_ZCD.css">
  </head>
  <body>
    <div id="app"></div>
    <template id="photo-generator-template">
      <section class="settings-section photo-generator" aria-label="Foto-Generator">
        <label>3D-Generator-Modell <select data-generation-model></select></label>
        <label data-depth-quality hidden>On-Device Qualität <select data-depth-preset></select></label>
        <label data-depth-edges hidden>Kanten <select data-depth-edge-mode></select></label>
        <button type="button" class="primary" data-generate-photo hidden>Foto → 3D-Splat erzeugen</button>
        <p class="file-hint" data-generation-status role="status" hidden></p>
      </section>
    </template>
    <template id="render-resolution-template">
      <details class="render-resolution">
        <summary>Render-Auflösung (<span data-resolution-value>100%</span>)</summary>
        <div class="render-resolution-panel">
          <div class="slider-label">Render-Auflösung <output>100%</output></div>
          <input aria-label="Render-Auflösung" type="range" min="0.35" max="1.5" step="0.05" value="1">
          <small data-resolution-hint>Gilt beim nächsten XR-Start.</small>
        </div>
      </details>
    </template>
  </body>
</html>
